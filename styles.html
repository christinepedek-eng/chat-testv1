<style>
  /* ----- General Resets & Body ----- */
  :root {
    --sent-bg: #007AFF; /* Apple Blue */
    --received-bg: #E5E5EA;
    --background-color: #FFFFFF;
    --text-dark: #000000;
    --text-light: #FFFFFF;
    --text-meta: #8E8E93; /* Lighter grey for timestamps */
    --input-bg: #F5F5F7;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh; /* Full viewport height */
    margin: 0;
    background-color: var(--background-color);
    font-size: 18px; /* Larger base font as requested */
    color: var(--text-dark);
    -webkit-font-smoothing: antialiased; /* Smoother fonts on Apple devices */
  }

  /* ----- Chatbox & Messages ----- */
  #chatbox {
    flex-grow: 1;
    overflow-y: auto;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 15px; /* More space between messages */
  }

  .message-container {
    display: flex;
    flex-direction: column;
    max-width: 80%;
    align-self: flex-start; /* Default: Received */
  }

  .message-container.sent {
    align-self: flex-end; /* Sent */
  }

  .message {
    padding: 12px 18px;
    border-radius: 22px; /* iMessage-like bubble radius */
    word-wrap: break-word;
    line-height: 1.45;
  }

  /* Received Message Style */
  .message-container:not(.sent) .message {
    background-color: var(--received-bg);
    color: var(--text-dark);
  }

  /* Sent Message Style */
  .message-container.sent .message {
    background-color: var(--sent-bg);
    color: var(--text-light);
  }

  .message .text-content {
    margin: 0; /* Remove default paragraph margin */
  }

  /* Timestamp below the bubble */
  .timestamp {
    font-size: 13px;
    color: var(--text-meta);
    margin-top: 6px;
    padding: 0 8px;
  }

  .message-container.sent .timestamp {
    text-align: right;
  }

  .message img {
    max-width: 100%;
    border-radius: 20px; /* Match bubble radius */
    display: block;
    /* Images in messages don't need extra padding */
  }
  .message-container .message img {
    margin: -12px -18px; /* Fill the bubble */
    width: calc(100% + 36px);
    max-width: calc(100% + 36px);
  }


  /* ----- Input Area ----- */
  #inputArea {
    display: flex;
    align-items: center;
    padding: 8px;
    background-color: var(--input-bg);
    border-top: 1px solid #E5E5E5;
    flex-shrink: 0;
  }

  #messageInput {
    flex-grow: 1;
    padding: 14px 20px;
    border: none;
    border-radius: 25px; /* Pill shape */
    margin: 0 8px;
    font-size: 18px; /* Match body font */
    background-color: white;
    border: 1px solid #E5E5E5;
  }
  #messageInput:focus {
    outline: none;
    border-color: var(--sent-bg);
    box-shadow: 0 0 0 1px var(--sent-bg);
  }

  /* BIGGER, BOLDER CTA buttons */
  .chat-button {
    flex-shrink: 0;
    width: 48px;   /* Much larger touch target */
    height: 48px;  /* Much larger touch target */
    background-color: var(--sent-bg);
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 28px; /* Larger icon */
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.1s ease-out;
  }
  .chat-button:active {
    transform: scale(0.9);
  }

  #imageButton {
    background-color: var(--received-bg);
    color: var(--text-meta);
    font-size: 24px;
  }
  #sendButton {
     padding-bottom: 2px; /* Visually center arrow */
  }

  /* ----- Utility ----- */
  .loading {
     text-align: center;
     color: var(--text-meta);
     padding: 20px;
     font-size: 15px;
  }
</style>
