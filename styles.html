<style>
  /* ----- General Resets & Body ----- */
  :root {
    --sent-bg: #0078FF;
    --received-bg: #E5E5EA;
    --background-color: #FFFFFF;
    --text-dark: #000000;
    --text-light: #FFFFFF;
    --text-meta: #6D6D72;
    --input-bg: #F0F0F0;
    --border-color: #E0E0E0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh; /* Full viewport height */
    margin: 0;
    background-color: var(--background-color);
    font-size: 17px; /* Larger base font for mobile */
    color: var(--text-dark);
  }

  /* ----- Chatbox & Messages ----- */
  #chatbox {
    flex-grow: 1;
    overflow-y: auto;
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 12px; /* Space between messages */
  }

  .message-container {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    align-self: flex-start; /* Default: Received */
  }

  .message-container.sent {
    align-self: flex-end; /* Sent */
  }

  .message {
    padding: 10px 15px;
    border-radius: 20px;
    word-wrap: break-word;
    line-height: 1.4;
  }

  /* Received Message Style */
  .message-container:not(.sent) .message {
    background-color: var(--received-bg);
    color: var(--text-dark);
    border-top-left-radius: 4px; /* Give it a "tail" */
  }

  /* Sent Message Style */
  .message-container.sent .message {
    background-color: var(--sent-bg);
    color: var(--text-light);
    border-top-right-radius: 4px; /* Give it a "tail" */
  }

  .message .text-content {
    margin: 0;
  }

  /* Timestamp below the bubble */
  .timestamp {
    font-size: 12px;
    color: var(--text-meta);
    margin-top: 5px;
    padding: 0 5px;
  }

  .message-container.sent .timestamp {
    text-align: right;
  }

  .message img {
    max-width: 100%;
    border-radius: 15px;
    display: block;
    margin-top: 5px;
  }

  /* ----- Input Area ----- */
  #inputArea {
    display: flex;
    align-items: center; /* Vertically center items */
    padding: 10px;
    background-color: var(--input-bg);
    flex-shrink: 0;
  }

  #messageInput {
    flex-grow: 1;
    padding: 12px 18px;
    border: none;
    border-radius: 22px; /* Pill shape */
    margin: 0 10px;
    font-size: 17px; /* Match body font */
    background-color: white;
  }
  #messageInput:focus {
    outline: none;
    box-shadow: 0 0 0 2px var(--sent-bg);
  }

  /* Big, modern CTA buttons */
  .chat-button {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    background-color: var(--sent-bg);
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.1s ease-out;
  }
  .chat-button:active {
    transform: scale(0.9); /* Click feedback */
  }

  #imageButton {
    background-color: #34C759; /* A different color for attach */
  }

  /* ----- Utility ----- */
  .loading {
     text-align: center;
     color: var(--text-meta);
     padding: 20px;
     font-size: 14px;
  }
</style>
