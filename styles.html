<style>
  /* ----- General Resets & Body ----- */
  :root {
    --sent-bg: #007AFF;
    --received-bg: #E5E5EA;
    --background-color: #FFFFFF;
    --text-dark: #000000;
    --text-light: #FFFFFF;
    --text-meta: #8E8E93;
    --input-bg: #F5F5F7;
    --button-green: #34C759;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    margin: 0;
    background-color: var(--background-color);
    font-size: 16px; /* A more reasonable base for responsive scaling */
    color: var(--text-dark);
    -webkit-font-smoothing: antialiased;
  }

  /* ----- Chatbox & Messages ----- */
  #chatbox {
    flex-grow: 1;
    overflow-y: auto;
    padding: 15px 10px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .message-container {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    align-self: flex-start;
  }

  .message-container.sent {
    align-self: flex-end;
  }

  .message {
    padding: 15px 22px;
    border-radius: 28px;
    word-wrap: break-word;
    line-height: 1.4;
    /* --- FONT SIZE REDUCED BY 50% from 63px --- */
    font-size: 32px;
  }

  .message-container:not(.sent) .message {
    background-color: var(--received-bg);
    color: var(--text-dark);
  }

  .message-container.sent .message {
    background-color: var(--sent-bg);
    color: var(--text-light);
  }

  .message .text-content {
    margin: 0;
  }

  .timestamp {
    font-size: 15px;
    color: var(--text-meta);
    margin-top: 8px;
    padding: 0 10px;
  }

  .message-container.sent .timestamp {
    text-align: right;
  }

  .message img {
    max-width: 100%;
    border-radius: 25px;
    display: block;
  }
  .message-container .message img {
    margin: -15px -22px;
    width: calc(100% + 44px);
    max-width: calc(100% + 44px);
  }

  /* ----- Input Area - FULLY RESPONSIVE ----- */
  #inputArea {
    display: flex;
    align-items: center;
    padding: 10px;
    background-color: var(--input-bg);
    border-top: 1px solid #E5E5E5;
    flex-shrink: 0;
    gap: 10px;
  }

  #messageInput {
    flex-grow: 1; /* Takes up available space */
    min-width: 0; /* Prevents overflow in flex containers */
    padding: 12px 20px;
    border: 1px solid #E5E5E5;
    border-radius: 30px;
    font-size: 24px;
    background-color: white;
  }
  #messageInput:focus {
    outline: none;
    border-color: var(--sent-bg);
  }

  /* --- RESPONSIVE CTA BUTTONS --- */
  .chat-button {
    flex-shrink: 0;
    /* Use viewport width (vw) for responsive sizing */
    width: 15vw;
    height: 15vw;
    max-width: 70px; /* Set a max size for larger screens */
    max-height: 70px;

    background-color: var(--sent-bg);
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.1s ease-out;
    /* Responsive font size for the icon */
    font-size: 8vw;
  }

  @media (min-width: 600px) {
      .chat-button {
          font-size: 40px; /* Cap icon size on larger screens */
      }
  }

  .chat-button:active {
    transform: scale(0.95);
  }

  #imageButton {
    background-color: var(--button-green);
  }
  #sendButton {
     padding-left: 1vw; /* Minor adjustment for visual centering */
  }

  /* ----- Utility ----- */
  .loading {
     text-align: center;
     color: var(--text-meta);
     padding: 25px;
     font-size: 18px;
  }
</style>
