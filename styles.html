<style>
  /* ----- General Resets & Body ----- */
  :root {
    --sent-bg: #007AFF;
    --received-bg: #E5E5EA;
    --background-color: #FFFFFF;
    --text-dark: #000000;
    --text-light: #FFFFFF;
    --text-meta: #8E8E93;
    --input-bg: #F5F5F7;
    --button-green: #34C759;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    margin: 0;
    background-color: var(--background-color);
    font-size: 18px; /* Base size for scaling */
    color: var(--text-dark);
    -webkit-font-smoothing: antialiased;
  }

  /* ----- Chatbox & Messages ----- */
  #chatbox {
    flex-grow: 1;
    overflow-y: auto;
    padding: 20px 10px;
    display: flex;
    flex-direction: column;
    gap: 25px;
  }

  .message-container {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    align-self: flex-start;
  }

  .message-container.sent {
    align-self: flex-end;
  }

  .message {
    padding: 20px 28px;
    border-radius: 35px;
    word-wrap: break-word;
    line-height: 1.45;
    /* --- FONT SIZE INCREASED BY 150% (from 32px) --- */
    font-size: 48px;
  }

  .message-container:not(.sent) .message {
    background-color: var(--received-bg);
    color: var(--text-dark);
  }

  .message-container.sent .message {
    background-color: var(--sent-bg);
    color: var(--text-light);
  }

  .message .text-content {
    margin: 0;
  }

  .timestamp {
    font-size: 18px;
    color: var(--text-meta);
    margin-top: 10px;
    padding: 0 12px;
  }

  .message-container.sent .timestamp {
    text-align: right;
  }

  .message img {
    max-width: 100%;
    border-radius: 30px;
    display: block;
  }
  .message-container .message img {
    margin: -20px -28px;
    width: calc(100% + 56px);
    max-width: calc(100% + 56px);
  }

  /* ----- Input Area - FINAL RESPONSIVE ----- */
  #inputArea {
    display: flex;
    align-items: center;
    padding: 12px;
    background-color: var(--input-bg);
    border-top: 1px solid #E5E5E5;
    flex-shrink: 0;
    gap: 12px;
  }

  #messageInput {
    flex-grow: 1;
    min-width: 0;
    padding: 15px 25px;
    border: 1px solid #E5E5E5;
    border-radius: 40px;
    font-size: 30px; /* Scaled input text */
    background-color: white;
  }
  #messageInput:focus {
    outline: none;
    border-color: var(--sent-bg);
  }

  /* --- CTA BUTTONS INCREASED BY 200% & RESPONSIVE --- */
  .chat-button {
    flex-shrink: 0;
    width: 25vw; /* Takes 25% of screen width */
    height: 25vw; /* Creates a perfect circle */
    max-width: 140px; /* Caps size on tablets/desktops */
    max-height: 140px;

    background-color: var(--sent-bg);
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.1s ease-out;
    font-size: 12vw; /* Icon scales with the button */
  }

  @media (min-width: 560px) { /* On screens wider than 560px, cap the size */
      .chat-button {
          font-size: 70px;
      }
  }

  .chat-button:active {
    transform: scale(0.95);
  }

  #imageButton {
    background-color: var(--button-green);
  }
  #sendButton {
     padding-left: 2vw;
  }

  /* ----- Utility ----- */
  .loading {
     text-align: center;
     color: var(--text-meta);
     padding: 30px;
     font-size: 20px;
  }
</style>
