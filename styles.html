<style>
  /* ----- General Resets & Body ----- */
  :root {
    --sent-bg: #007AFF;
    --received-bg: #E5E5EA;
    --background-color: #FFFFFF;
    --text-dark: #000000;
    --text-light: #FFFFFF;
    --text-meta: #8E8E93;
    --input-bg: #F5F5F7;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    margin: 0;
    background-color: var(--background-color);
    /* Base font size increased significantly */
    font-size: 22px;
    color: var(--text-dark);
    -webkit-font-smoothing: antialiased;
  }

  /* ----- Chatbox & Messages ----- */
  #chatbox {
    flex-grow: 1;
    overflow-y: auto;
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    gap: 25px;
  }

  .message-container {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    align-self: flex-start;
  }

  .message-container.sent {
    align-self: flex-end;
  }

  .message {
    padding: 20px 30px;
    border-radius: 35px;
    word-wrap: break-word;
    line-height: 1.4;
    /* --- FONT SIZE INCREASED BY 350% (from 18px baseline) --- */
    font-size: 63px;
  }

  .message-container:not(.sent) .message {
    background-color: var(--received-bg);
    color: var(--text-dark);
  }

  .message-container.sent .message {
    background-color: var(--sent-bg);
    color: var(--text-light);
  }

  .message .text-content {
    margin: 0;
  }

  .timestamp {
    /* Timestamp also needs to be readable */
    font-size: 20px;
    color: var(--text-meta);
    margin-top: 10px;
    padding: 0 12px;
  }

  .message-container.sent .timestamp {
    text-align: right;
  }

  .message img {
    max-width: 100%;
    border-radius: 30px;
    display: block;
  }
  .message-container .message img {
    margin: -20px -30px;
    width: calc(100% + 60px);
    max-width: calc(100% + 60px);
  }

  /* ----- Input Area ----- */
  #inputArea {
    display: flex;
    align-items: center;
    padding: 15px;
    background-color: var(--input-bg);
    border-top: 1px solid #E5E5E5;
    flex-shrink: 0;
    gap: 15px;
  }

  #messageInput {
    flex-grow: 1;
    padding: 25px 35px;
    border: 2px solid #E5E5E5;
    border-radius: 45px;
    font-size: 56px; /* Slightly smaller than messages for context */
    background-color: white;
  }
  #messageInput:focus {
    outline: none;
    border-color: var(--sent-bg);
    box-shadow: 0 0 0 2px var(--sent-bg);
  }

  /* --- CTA BUTTONS INCREASED BY 500% (from 48px baseline) --- */
  .chat-button {
    flex-shrink: 0;
    width: 240px;
    height: 240px;
    background-color: var(--sent-bg);
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.1s ease-out;
    /* Icon size scaled up dramatically */
    font-size: 150px;
  }
  .chat-button:active {
    transform: scale(0.95);
  }

  #imageButton {
    background-color: #34C759; /* Green for attach */
    font-size: 130px;
  }
  #sendButton {
     padding-left: 15px; /* Visually center arrow */
  }

  /* ----- Utility ----- */
  .loading {
     text-align: center;
     color: var(--text-meta);
     padding: 30px;
     font-size: 25px;
  }
</style>
